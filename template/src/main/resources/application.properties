spring.application.name=${APP_NAME:template}
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Primary Datasource ----
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:template_db}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# ---- Secondary Datasource ----
app.datasource.secondary.url=${SECONDARY_DATABASE_URL:jdbc:h2:mem:secondary_db}
app.datasource.secondary.username=${SECONDARY_DATABASE_USERNAME:sa}
app.datasource.secondary.password=${SECONDARY_DATABASE_PASSWORD:}
app.datasource.secondary.driver-class-name=${SECONDARY_DATABASE_DRIVER:org.h2.Driver}

# ---- JPA / Hibernate ----
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway Migration (enabled only in prod) ----
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# ---- Actuator / Health ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---- AES-CBC ----
app.aes-cbc.key=${AES_KEY_B64:}

# ---- Rate Limiting (Bucket4j) ----
app.rate-limit.public.capacity=${RATE_LIMIT_PUBLIC_CAPACITY:100}
app.rate-limit.public.refill-per-minute=${RATE_LIMIT_PUBLIC_REFILL:100}
app.rate-limit.authenticated.capacity=${RATE_LIMIT_AUTH_CAPACITY:60}
app.rate-limit.authenticated.refill-per-minute=${RATE_LIMIT_AUTH_REFILL:60}
app.rate-limit.reset-seconds=${RATE_LIMIT_RESET_SECONDS:60}

# ---- File Storage ----
app.file-storage.type=${FILE_STORAGE_TYPE:s3}
app.file-storage.s3.endpoint=${S3_ENDPOINT:}
app.file-storage.s3.bucket=${S3_BUCKET:}
app.file-storage.s3.access-key=${S3_ACCESS_KEY:}
app.file-storage.s3.secret-key=${S3_SECRET_KEY:}
app.file-storage.sftp.host=${SFTP_HOST:localhost}
app.file-storage.sftp.port=${SFTP_PORT:22}
app.file-storage.sftp.username=${SFTP_USERNAME:}
app.file-storage.sftp.password=${SFTP_PASSWORD:}
app.file-storage.ftp.host=${FTP_HOST:localhost}
app.file-storage.ftp.port=${FTP_PORT:21}
app.file-storage.ftp.username=${FTP_USERNAME:}
app.file-storage.ftp.password=${FTP_PASSWORD:}

# ---- Logging ----
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.sepring.template=${LOG_LEVEL_APP:DEBUG}
